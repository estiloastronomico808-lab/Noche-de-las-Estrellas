<style>
:root{
  --bg:#000;
  --card:#0e0a17;
  --card2:#1b1230;
  --tx:#f5f0ff;
  --mut:#b8abd6;
  --ac:#b57bff;
  --pri:#7c3aed;
  --bd:#3a2a5e;
  --err:#3d0b24;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:radial-gradient(1000px 500px at 85% -10%,#2a0f55 0,transparent 60%),var(--bg);
  color:var(--tx);
  font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100vh;
}

main{
  max-width:640px;
  margin:0 auto;
  padding:16px;
}

h1{font-size:1.35rem; margin:8px 0 4px}
h2{font-size:1.1rem; margin:20px 0 8px}
p{margin:4px 0}
.mut{color:var(--mut); font-size:.9rem}
button,a.btn{
  font:inherit;
  cursor:pointer;
  border-radius:12px;
  padding:14px 16px;
  border:1px solid var(--bd);
  background:var(--card2);
  color:var(--tx);
  width:100%;
  margin-top:8px;
  text-align:center;
  text-decoration:none;
  display:block;
}
button.pri,a.btn.pri{
  background:var(--pri);
  color:#fff;
  border-color:#9d6bff;
  font-weight:600;
}
button:disabled{
  opacity:.6;
  cursor:wait;
}
button:focus-visible,a:focus-visible,input:focus-visible,li:focus-visible{
  outline:3px solid #fff;
  outline-offset:2px;
}

.card{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:14px;
  padding:16px;
  margin-top:8px;
}
.card h3{margin:0 0 2px; font-size:1.15rem}
.err{background:var(--err); border-color:#a63a62}

input[type=search]{
  width:100%;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--bd);
  background:var(--card);
  color:var(--tx);
  font:inherit;
}

ul.lista{
  list-style:none;
  margin:12px 0 0;
  padding:0;
}
ul.lista li{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  padding:12px 14px;
  margin-top:6px;
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:12px;
  cursor:pointer;
}
ul.lista li:hover{background:var(--card2)}
ul.lista small{color:var(--mut); display:block}
.dist{white-space:nowrap; color:var(--ac); font-weight:600}

.fila{margin:10px 0}
.fila b{
  display:block;
  font-size:.85rem;
  color:var(--mut);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  background:var(--card2);
  border:1px solid var(--bd);
  border-radius:999px;
  padding:6px 12px;
  font-size:.92rem;
}

.back{width:auto; display:inline-block; padding:8px 14px; margin:0 0 8px}
.aviso{font-size:.85rem; color:var(--mut); margin-top:8px}

[hidden]{display:none!important}

.links{display:flex; flex-wrap:wrap; gap:8px}
a.link{
  background:var(--card2);
  border:1px solid var(--bd);
  border-radius:999px;
  padding:8px 14px;
  color:var(--tx);
  text-decoration:none;
  font-size:.92rem;
}
a.link:hover{border-color:var(--ac)}
.sec{margin-top:22px}
.nota{color:var(--mut); font-size:.92rem; margin:2px 0 0}

.instalar{margin-top:16px}
.instalar p{margin:6px 0 0; font-size:.88rem; color:var(--mut)}

.banner{
  background:var(--card);
  border-bottom:1px solid var(--bd);
  display:flex;
  justify-content:center;
}
.banner img{
  display:block;
  width:100%;
  max-width:960px;
  height:auto;
  max-height:220px;
  object-fit:contain;
}
</style>
</head>

];

const $app = document.getElementById('app');
let ubicado = false;
let cercana = null;
let error = null;
let buscando = false;
let instalador = null;
const norm = s => s.toLowerCase()
  .normalize('NFD')
  .replace(/[̀-ͯ]/g, '');
function el(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)){
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => e.append(c));
  return e;
}

const horario = s => (s.inicio && s.fin) ? `${s.inicio} – ${s.fin} h` : 'Horario por confirmar';
function distTxt(m){
  if (m == null) return '';
  if (m < 1000) return `${Math.round(m)} m`;
  return `${(m/1000).toFixed(m < 10000 ? 1 : 0)} km`;
}

function haversine(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const rad = x => x * Math.PI / 180;
  const dLat = rad(lat2 - lat1);
  const dLon = rad(lon2 - lon1);
  const h = Math.sin(dLat/2)**2
          + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function mapaUrl(s){
  if (s.mapa) return s.mapa;
  const base = 'https://www.google.com/maps/search/?api=1&query=';
  if (!s.coordAprox) return base + s.lat + ',' + s.lng;
  const q = [s.lugar, s.direccion, s.nombre].filter(Boolean).join(', ');
  return base + encodeURIComponent(q);
}

const seguro = u => /^(https?:|mailto:|tel:)/i.test(u || '');

const enlace = (texto, href) => el('a', {class:'link', href, target:'_blank', rel:'noopener', text:texto});

function ubicar(){
  error = null;
  if (!('geolocation' in navigator)){
    error = 'Tu navegador no permite obtener la ubicación. Elige tu sede en la lista.';
    return render();
  }
  buscando = true;
  render();

  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: la, longitude: lo } = pos.coords;
    SEDES.forEach(s => s.dist = haversine(la, lo, s.lat, s.lng));
    SEDES.sort((a, b) => a.dist - b.dist);
    ubicado = true;
    cercana = SEDES[0];
    buscando = false;
    render();
  }, err => {
    buscando = false;
    error = err.code === 1
      ? 'Sin permiso de ubicación. Actívalo en el navegador o elige tu sede en la lista.'
      : err.code === 3
        ? 'Tardó demasiado en obtener tu ubicación. Inténtalo de nuevo o elige tu sede en la lista.'
        : 'No se pudo obtener tu ubicación. Inténtalo de nuevo o elige tu sede en la lista.';
    render();
  }, {
    enableHighAccuracy: false,
    timeout: 15000,
    maximumAge: 300000
  });
}

function tarjeta(s){
  return el('div', {class:'card'},
    el('h3', {text: s.nombre}),
    s.dist != null ? el('p', {class:'mut', text:`A ${distTxt(s.dist)} aprox. (en línea recta)`}) : '',
    s.lugar ? el('p', {text: s.lugar}) : '',
    el('p', {text: horario(s)}),
    s.actividad ? el('p', {text: `★ ${s.actividad}` + (s.horaActividad ? ` (${s.horaActividad} h)` : '')}) : '');
}

function fila(titulo, texto){
  return el('div', {class:'fila'}, el('b', {text: titulo}), el('span', {text: texto}));
}

function vistaInicio(){
  const v = el('div', {},
    el('h1', {text:'Noche de las Estrellas 2026'}),
    el('p',  {text:'La fiesta astronómica más grande de latinoamérica.'}),
    el('p',  {text:'¡Ven y disfruta con nosotros!'}),
    el('p',  {text:'14 de noviembre 2026'}),
    el('h2',  {text:'México - Costa Rica - Colombia - Guatemala'}),
    el('p',  {text:'Encuentra la sede más cercana a ti'}),
    el('p',  {class:'mut', text:`${SEDES.length} sedes en todo México.`}),
    el('button', {class:'pri', text: buscando ? 'Buscando…' : '📍 Encontrar mi sede',
                  onclick: ubicar, ...(buscando ? {disabled:''} : {})}),
    el('button', {text:'Ver todas las sedes', onclick: () => location.hash = '#lista'}));

  if (error) v.append(el('div', {class:'card err', role:'alert', text:error}));
  if (cercana){
    v.append(el('h2', {text:'Tu sede más cercana'}), tarjeta(cercana),
      el('button', {text:'Ver actividades y detalles', onclick: () => location.hash = '#sede/' + cercana.id}));
  }
  const esApp = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (!esApp && instalador){
    v.append(el('div', {class:'instalar'},
      el('button', {text:'⬇️ Instalar app', onclick: async () => {
        instalador.prompt();
        await instalador.userChoice;
        instalador = null; render();
      }})));
  } else if (!esApp && esIOS){
    v.append(el('div', {class:'instalar'},
      el('p', {text:'Para instalarla en tu iPhone: toca el botón Compartir (el cuadrado con flecha) y elige "Agregar a pantalla de inicio".'})));
  }
  v.append(el('p', {class:'aviso', text:'Tu ubicación solo se usa en tu dispositivo para calcular la distancia; no se envía a ningún servidor.'}));
  return v;
}

function vistaLista(){
  const input = el('input', {type:'search', placeholder:'Buscar sede o ciudad', 'aria-label':'Buscar sede'});
  const ul = el('ul', {class:'lista'});
  const base = [...SEDES];
  if (!ubicado) base.sort((a, b) => norm(a.nombre).localeCompare(norm(b.nombre)));

  const pintar = () => {
    ul.replaceChildren();
    const q = norm(input.value.trim());
    base.filter(s => !q || norm(s.nombre).includes(q) || norm(s.lugar || '').includes(q))
        .forEach(s => {
      const li = el('li', {tabindex:'0', role:'link'},
        el('div', {}, el('span', {text: s.nombre}), el('small', {text: s.lugar || horario(s)})),
        el('span', {class:'dist', text: ubicado ? distTxt(s.dist) : '›'}));
      const ir = () => location.hash = '#sede/' + s.id;
      li.addEventListener('click', ir);
      li.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ir(); }
      });
      ul.append(li);
    });
    if (!ul.children.length) ul.append(el('p', {class:'mut', text:'Sin resultados.'}));
  };
  input.addEventListener('input', pintar);
  pintar();
  return el('div', {},
    el('button', {class:'back', text:'← Inicio', onclick: () => location.hash = ''}),
    el('h1', {text:'Todas las sedes'}), input, ul);
}

function vistaDetalle(id){
  const s = SEDES.find(x => String(x.id) === String(id));
  if (!s) return vistaLista();
  const v = el('div', {},
    el('button', {class:'back', text:'← Atrás',
                  onclick: () => history.length > 1 ? history.back() : (location.hash = '')}),
    el('h1', {text: s.nombre}));
  if (s.dist != null) v.append(el('p', {class:'mut',
    text:`A ${distTxt(s.dist)} aprox. de ti` + (s.coordAprox ? ' (ubicación aproximada)' : '')}));

  v.append(fila('Horario', horario(s)));
  if (s.lugar) v.append(fila('Lugar', s.direccion ? `${s.lugar} — ${s.direccion}` : s.lugar));
  if (s.actividad) v.append(fila('Actividad principal',
    s.horaActividad ? `${s.actividad} (${s.horaActividad} h)` : s.actividad));

  v.append(fila('Registro', s.requiereRegistro ? 'La participación requiere registro previo'
                                               : 'No requiere registro previo'));
  if (s.notaRegistro) v.append(el('p', {class:'nota', text:s.notaRegistro}));
  if (s.enlaceRegistro && seguro(s.enlaceRegistro))
    v.append(el('div', {class:'links'}, enlace('📝 Registrarme', s.enlaceRegistro)));

  v.append(el('h2', {class:'sec', text:'Accesibilidad e información'}));
  if (s.acceso) v.append(fila('Acceso (discapacidad motriz)', s.acceso));
  if (s.publico.length) {
    v.append(el('div', {class:'fila'}, el('b', {text:'Actividades pensadas para'}),
      el('div', {class:'chips'}, s.publico.map(p => el('span', {class:'chip', text:p})))));
  }
  if (s.alimentos) v.append(fila('Alimentos y bebidas', s.alimentos));
  if (s.mascotas)  v.append(fila('Mascotas', s.mascotas));

  if (s.contacto.length) {
    v.append(el('h2', {class:'sec', text:'Contacto'}));
    v.append(el('div', {class:'links'}, s.contacto.map(c =>
      (c.url && seguro(c.url))
        ? enlace(c.etiqueta === c.texto ? c.etiqueta : `${c.etiqueta}: ${c.texto}`, c.url)
        : el('span', {class:'chip', text:c.texto}))));
  }

  const mats = [];
  if (s.cartel    && seguro(s.cartel))    mats.push(enlace('🖼️ Cartel', s.cartel));
  if (s.programa  && seguro(s.programa))  mats.push(enlace('📅 Programa', s.programa));
  s.galeria.filter(seguro).forEach((g, i) =>
    mats.push(enlace(s.galeria.length === 1 ? '📷 Galería' : `📷 Galería ${i + 1}`, g)));
  if (s.web && seguro(s.web)) mats.push(enlace('🌐 Sitio web', s.web));
  if (mats.length) {
    v.append(el('h2', {class:'sec', text:'Cartel y programa'}));
    v.append(el('div', {class:'links'}, mats));
  }

  v.append(el('a', {class:'btn pri', href: mapaUrl(s), target:'_blank', rel:'noopener', text:'🧭 Cómo llegar'}));
  return v;
}

function render(){
  const h = location.hash;
  let v;
  if (h.startsWith('#sede/')) v = vistaDetalle(h.slice(6));
  else if (h === '#lista')    v = vistaLista();
  else                        v = vistaInicio();
  $app.replaceChildren(v);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
render();

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  instalador = e;
  render();
});
window.addEventListener('appinstalled', () => { instalador = null; render(); });
</script>
